# Continuous integration (IMPLEMENTATION_PLAN.md T02, ARCHITECTURE.md section 18).
# Runs on every pull request to main and on every push to main.
# Deployment workflows are added in Phase 11.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, migrations, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: libraryhive
          POSTGRES_USER: libraryhive
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U libraryhive -d libraryhive"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # CI-only throwaway values; real secrets never appear in CI for this job.
      DJANGO_SETTINGS_MODULE: config.settings.test
      ENVIRONMENT: test
      SECRET_KEY: ci-only-secret-key-not-used-anywhere-else-0123456789abcdef
      JWT_SIGNING_KEY: ci-only-jwt-signing-key-not-used-anywhere-else-0123456789
      DATABASE_URL: postgres://libraryhive:ci-only-password@127.0.0.1:5432/libraryhive
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Formatting (ruff)
        run: ruff format --check .

      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run

      - name: Migrations apply to a fresh database
        run: python manage.py migrate --noinput

      - name: Production settings load with safe values
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
          ENVIRONMENT: production
          DEBUG: "False"
          ALLOWED_HOSTS: api.example.com
          CORS_ALLOWED_ORIGINS: https://app.example.com
          SECRET_KEY: ci-only-production-check-secret-key-0123456789abcdefghijklmnop
          JWT_SIGNING_KEY: ci-only-production-check-jwt-key-0123456789abcdefghijklmnop
        run: python manage.py check --deploy --fail-level ERROR

      - name: Tests with coverage
        run: |
          coverage run manage.py test
          coverage report --fail-under=85

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000/api/v1
      BACKEND_ORIGIN: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Tests (Vitest)
        run: npm test

      - name: Production build
        run: npm run build

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python dependencies (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: npm dependencies (npm audit, runtime only)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
