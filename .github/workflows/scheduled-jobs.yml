# Scheduled jobs: renewal reminders, owner summaries and attendance auto-close (BACKEND_ARCHITECTURE.md 11).
#
# GitHub Actions is the scheduler; Django does the work (`manage.py run_scheduled_jobs --only <step>`).
# Every step is idempotent (unique `dedup_key`, row locks), so a retry, a manual run or an overlapping run never
# creates a duplicate notification. Schedules are best-effort: GitHub may start a run late or skip it, so nothing
# here is real time. Scheduled runs happen only on the default branch, fork pull requests never receive the secrets,
# and the job itself refuses to run from any other branch (see `if:` below).
#
# Not scheduled on purpose: `reconcile_payments` (online payments are off), `expire_holds` (hold expiry is derived on
# every read) and `send_emails` (no email provider yet). Do not also run these jobs from Render.
#
# Schedules (UTC, because GitHub cron is always UTC; IST = UTC+5:30). Both avoid the top of the hour, when GitHub's
# queue is busiest.
#   37 3 * * *   = 09:07 IST daily   renewal reminders and owner summaries
#   17 * * * *   = hh:47 IST hourly   attendance auto-close

name: Scheduled jobs

on:
  schedule:
    - cron: "37 3 * * *"
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      job:
        description: "Which job to run"
        type: choice
        default: daily
        options:
          - daily
          - attendance
      dry_run:
        description: "Dry run: show what would happen, save nothing"
        type: boolean
        default: true

permissions:
  contents: read

# One concurrency group per job kind, so a slow daily run can never hold up or replace the hourly attendance run
# (GitHub keeps only one pending run per group and cancels an older pending one). Within a group a later run waits
# instead of overlapping, and a running one is never cancelled. Runs from another branch and manual dry runs get
# their own groups, so they can never queue behind or replace a real scheduled run.
#   libraryhive-daily | libraryhive-attendance            real runs on main (scheduled or manual)
#   ...-dry                                                manual dry runs
#   ...-offbranch                                          anything started from a branch other than main
concurrency:
  group: "libraryhive-${{ github.event_name == 'schedule' && (github.event.schedule == '17 * * * *' && 'attendance' || 'daily') || inputs.job }}${{ github.ref != 'refs/heads/main' && '-offbranch' || '' }}${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '-dry' || '' }}"
  cancel-in-progress: false

jobs:
  # A manual run started from any branch other than main fails loudly here, before any secret is used.
  wrong-branch:
    name: Refuse to run outside main
    if: github.repository == 'Priyasaini7604/LibraryHive' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Stop
        env:
          REF: ${{ github.ref }}
        run: |
          echo "::error::Scheduled jobs run only from the main branch (this run is on $REF). Nothing was run."
          exit 1

  run:
    name: Run scheduled job
    # Only in the main repository, and only from the main branch: forks have no secrets and must not run against
    # anyone's database, and a manual run from a feature branch must not use the secrets.
    if: github.repository == 'Priyasaini7604/LibraryHive' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SETTINGS_MODULE: config.settings.production
      ENVIRONMENT: staging
      DEBUG: "False"
      # The production settings guard needs these; the jobs never serve HTTP, so the values are placeholders.
      ALLOWED_HOSTS: scheduled-jobs.invalid
      CORS_ALLOWED_ORIGINS: https://scheduled-jobs.invalid
      CSRF_TRUSTED_ORIGINS: https://scheduled-jobs.invalid
      # Email stays off until a provider exists, so nothing is ever marked as sent.
      EMAIL_NOTIFICATIONS_ENABLED: "false"
      # The secrets are added only to the steps that need them (not to the dependency install).
    steps:
      - name: Choose the job
        id: job
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_JOB: ${{ inputs.job }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          # Scheduled runs are real; a manual run is a dry run unless you untick the box.
          mode=daily
          dry=false
          if [ "$EVENT" = "schedule" ]; then
            if [ "$SCHEDULE" = "17 * * * *" ]; then mode=attendance; fi
          else
            mode="$INPUT_JOB"
            dry="$INPUT_DRY_RUN"
          fi
          case "$mode" in
            daily) args="--only renewal_notifications --only owner_summaries" ;;
            attendance) args="--only auto_close_attendance" ;;
            *) echo "Unknown job: $mode"; exit 1 ;;
          esac
          if [ "$dry" = "true" ]; then args="$args --dry-run"; fi
          echo "job=$mode" >> "$GITHUB_OUTPUT"
          echo "args=$args" >> "$GITHUB_OUTPUT"
          echo "Running job '$mode' (dry run: $dry)"

      - name: Check the secrets are set
        env:
          # Repository secrets (Settings > Secrets and variables > Actions). Never echoed.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          JWT_SIGNING_KEY: ${{ secrets.JWT_SIGNING_KEY }}
        run: |
          missing=""
          for name in DATABASE_URL SECRET_KEY JWT_SIGNING_KEY; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing. See BACKEND_ARCHITECTURE.md section 11."
            exit 1
          fi

      - name: Check the database connection settings
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          # Without printing the URL: Neon needs TLS, and the direct (not pooled) host is required for row locks.
          case "$DATABASE_URL" in
            *sslmode=require*|*sslmode=verify-full*|*sslmode=verify-ca*) ;;
            *) echo "::error::DATABASE_URL must include sslmode=require."; exit 1 ;;
          esac
          case "$DATABASE_URL" in
            *-pooler.*) echo "::error::Use Neon's direct connection string (no -pooler in the host name)."; exit 1 ;;
          esac
          # Hide the host name too, in case a connection error ever prints it.
          host=$(printf '%s' "$DATABASE_URL" | sed -E 's#^[a-z]+://[^@]*@([^:/?]+).*#\1#')
          if [ -n "$host" ]; then echo "::add-mask::$host"; fi

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check the database schema is up to date (read-only)
        # Fails loudly if migrations have not been applied; it never changes the database.
        env:
          # Repository secrets (Settings > Secrets and variables > Actions). Never echoed.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          JWT_SIGNING_KEY: ${{ secrets.JWT_SIGNING_KEY }}
        run: python manage.py migrate --check

      - name: Run the job
        env:
          ARGS: ${{ steps.job.outputs.args }}
          # Repository secrets (Settings > Secrets and variables > Actions). Never echoed.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          JWT_SIGNING_KEY: ${{ secrets.JWT_SIGNING_KEY }}
        run: |
          # A second attempt is safe because every step is idempotent; it covers Neon waking from suspend.
          for attempt in 1 2; do
            echo "Attempt $attempt"
            # shellcheck disable=SC2086
            if python manage.py run_scheduled_jobs $ARGS; then
              exit 0
            fi
            if [ "$attempt" = "1" ]; then sleep 30; fi
          done
          echo "::error::The scheduled job failed twice. Completed work is saved; the next run finishes the rest."
          exit 1
